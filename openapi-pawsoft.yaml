# ═══════════════════════════════════════════════════════════════════════════
# COMPONENTES
# ═══════════════════════════════════════════════════════════════════════════

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT obtenido tras autenticación exitosa.
        Incluir en el header: `Authorization: Bearer <token>`
  
  schemas:
    # ─────────────────────────────────────────────────────────────────────────
    # AUTENTICACIÓN
    # ─────────────────────────────────────────────────────────────────────────
    
    UserRequest:
      type: object
      required:
        - name
        - email
        - password
        - phone
        - recaptchaToken
      properties:
        name:
          type: string
          description: Nombre completo del usuario
          example: "Juan Pérez"
        email:
          type: string
          format: email
          description: Correo electrónico
          example: "juan.perez@example.com"
        password:
          type: string
          format: password
          description: |
            Contraseña (mínimo 8 caracteres, una mayúscula, un número y un carácter especial)
          example: "Password123!"
          pattern: '^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$'
        phone:
          type: string
          description: Teléfono colombiano (10 dígitos, inicia con 3)
          example: "3001234567"
          pattern: '^3[0-9]{9}$'
        recaptchaToken:
          type: string
          description: Token generado por reCAPTCHA v2
    
    LoginRequest:
      type: object
      required:
        - email
        - password
        - recaptchaToken
      properties:
        email:
          type: string
          format: email
          example: "usuario@example.com"
        password:
          type: string
          format: password
          example: "Password123!"
        recaptchaToken:
          type: string
          description: Token generado por reCAPTCHA v2
    
    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: "Autenticación exitosa"
        email:
          type: string
          format: email
          example: "usuario@example.com"
        role:
          type: string
          enum:
            - ROLE_ADMIN
            - ROLE_VETERINARIO
            - ROLE_RECEPCIONISTA
            - ROLE_CLIENTE
          example: "ROLE_CLIENTE"
        token:
          type: string
          description: JWT para autenticación en endpoints protegidos
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        mustChangePassword:
          type: boolean
          description: Indica si el usuario debe cambiar su contraseña temporal
          example: false
    
    ChangePasswordRequest:
      type: object
      required:
        - email
        - newPassword
      properties:
        email:
          type: string
          format: email
        newPassword:
          type: string
          format: password
          description: Nueva contraseña
    
    RequestPasswordReset:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Correo del usuario que solicita recuperación
    
    ResetPassword:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          description: Token recibido por correo
        newPassword:
          type: string
          format: password
          description: Nueva contraseña
    
    # ─────────────────────────────────────────────────────────────────────────
    # USUARIOS
    # ─────────────────────────────────────────────────────────────────────────
    
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan.perez@example.com"
        phone:
          type: string
          example: "3001234567"
        role:
          type: string
          enum:
            - ROLE_ADMIN
            - ROLE_VETERINARIO
            - ROLE_RECEPCIONISTA
            - ROLE_CLIENTE
          example: "ROLE_CLIENTE"
        photoUrl:
          type: string
          format: uri
          description: URL de foto en Cloudinary (solo veterinarios)
          example: "https://res.cloudinary.com/dp24p2jhq/image/upload/v1234567890/pawsoft/staff/foto.jpg"
        enabled:
          type: boolean
          description: Estado activo/inactivo del usuario
          example: true
    
    StaffUserRequest:
      type: object
      required:
        - nombre
        - email
        - role
      properties:
        nombre:
          type: string
          description: Nombre completo del usuario staff
          example: "Dr. Carlos Martínez"
        email:
          type: string
          format: email
          example: "carlos.martinez@pawsoft.com"
        role:
          type: string
          enum:
            - ROLE_VETERINARIO
            - ROLE_RECEPCIONISTA
          description: Rol asignado al usuario staff
        photoUrl:
          type: string
          format: uri
          description: URL de foto subida a Cloudinary (opcional, solo veterinarios)
    
    # ─────────────────────────────────────────────────────────────────────────
    # MASCOTAS
    # ─────────────────────────────────────────────────────────────────────────
    
    PetRequest:
      type: object
      required:
        - name
        - species
        - sex
      properties:
        name:
          type: string
          example: "Max"
        species:
          type: string
          enum:
            - Perro
            - Gato
            - Conejo
            - Ave
            - Hamster
          example: "Perro"
        breed:
          type: string
          example: "Golden Retriever"
        birthDate:
          type: string
          format: date
          description: Fecha de nacimiento (YYYY-MM-DD)
          example: "2020-05-15"
        sex:
          type: string
          enum:
            - Macho
            - Hembra
          example: "Macho"
        ownerEmail:
          type: string
          format: email
          description: Email del propietario (usado por recepcionista)
        photoUrl:
          type: string
          format: uri
          description: URL de foto subida a Cloudinary
    
    PetResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Max"
        species:
          type: string
          example: "Perro"
        breed:
          type: string
          example: "Golden Retriever"
        birthDate:
          type: string
          format: date
          example: "2020-05-15"
        sex:
          type: string
          example: "Macho"
        ownerEmail:
          type: string
          format: email
          example: "cliente@example.com"
        photoUrl:
          type: string
          format: uri
          example: "https://res.cloudinary.com/dp24p2jhq/image/upload/v1234567890/pawsoft/pets/max.jpg"
    
    RecepPetRequest:
      type: object
      required:
        - name
        - species
        - sex
        - birthDate
        - ownerEmail
      properties:
        name:
          type: string
          example: "Luna"
        species:
          type: string
          example: "Gato"
        breed:
          type: string
          example: "Siamés"
        sex:
          type: string
          enum:
            - Macho
            - Hembra
          example: "Hembra"
        birthDate:
          type: string
          format: date
          description: Fecha de nacimiento (YYYY-MM-DD)
          example: "2021-03-10"
        photoUrl:
          type: string
          format: uri
        ownerEmail:
          type: string
          format: email
          description: Email del propietario
          example: "cliente@example.com"
    
    # ─────────────────────────────────────────────────────────────────────────
    # CITAS
    # ─────────────────────────────────────────────────────────────────────────
    
    CreateAppointmentRequest:
      type: object
      required:
        - petId
        - date
        - time
        - vetId
        - reason
      properties:
        petId:
          type: integer
          format: int64
          description: ID de la mascota
          example: 1
        date:
          type: string
          format: date
          description: Fecha de la cita (debe ser futura)
          example: "2024-03-20"
        time:
          type: string
          format: time
          description: Hora de la cita (HH:mm)
          example: "10:00"
        vetId:
          type: integer
          format: int64
          description: ID del veterinario
          example: 5
        reason:
          type: string
          minLength: 5
          maxLength: 255
          description: Motivo de la cita
          example: "Consulta general"
    
    AppointmentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        date:
          type: string
          format: date
          example: "2024-03-20"
        time:
          type: string
          format: time
          example: "10:00"
        reason:
          type: string
          example: "Consulta general"
        status:
          type: string
          enum:
            - UPCOMING
            - CONFIRMED
            - NO_SHOW
            - CANCELLED
            - COMPLETED
          example: "UPCOMING"
        petName:
          type: string
          example: "Max"
        vetName:
          type: string
          example: "Dr. Carlos Martínez"
        petPhotoUrl:
          type: string
          format: uri
    
    RecepCreateAppointmentRequest:
      type: object
      required:
        - clientEmail
        - petId
        - vetId
        - date
        - time
        - reason
      properties:
        clientEmail:
          type: string
          format: email
          description: Email del cliente dueño de la mascota
          example: "cliente@example.com"
        petId:
          type: integer
          format: int64
          example: 1
        vetId:
          type: integer
          format: int64
          example: 5
        date:
          type: string
          format: date
          example: "2024-03-20"
        time:
          type: string
          format: time
          description: Hora en formato HH:mm
          example: "10:00"
        reason:
          type: string
          example: "Vacunación"
        notes:
          type: string
          description: Notas adicionales opcionales
    
    RecepUpdateAppointmentRequest:
      type: object
      required:
        - date
        - time
        - vetId
      properties:
        date:
          type: string
          format: date
          example: "2024-03-21"
        time:
          type: string
          format: time
          example: "11:00"
        vetId:
          type: integer
          format: int64
          example: 5
        reason:
          type: string
          example: "Control de rutina"
        notes:
          type: string
    
    RecepCancelRequest:
      type: object
      properties:
        cancelReason:
          type: string
          description: Motivo de cancelación (opcional)
          example: "Cliente solicitó reprogramación"
    
    RecepAppointmentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        date:
          type: string
          format: date
          example: "2024-03-20"
        time:
          type: string
          format: time
          example: "10:00"
        reason:
          type: string
          example: "Consulta general"
        status:
          type: string
          enum:
            - UPCOMING
            - CONFIRMED
            - NO_SHOW
            - CANCELLED
            - COMPLETED
          example: "CONFIRMED"
        cancelReason:
          type: string
          description: Motivo de cancelación (si aplica)
        clientId:
          type: integer
          format: int64
          example: 10
        clientName:
          type: string
          example: "Juan Pérez"
        clientEmail:
          type: string
          format: email
          example: "juan.perez@example.com"
        petId:
          type: integer
          format: int64
          example: 1
        petName:
          type: string
          example: "Max"
        petSpecies:
          type: string
          example: "Perro"
        petPhotoUrl:
          type: string
          format: uri
        petBreed:
          type: string
          example: "Golden Retriever"
        petBirthday:
          type: string
          format: date
          example: "2020-05-15"
        vetId:
          type: integer
          format: int64
          example: 5
        vetName:
          type: string
          example: "Dr. Carlos Martínez"
        vetPhotoUrl:
          type: string
          format: uri
        notes:
          type: string
          description: Notas adicionales

    
    # ─────────────────────────────────────────────────────────────────────────
    # PAGOS
    # ─────────────────────────────────────────────────────────────────────────
    
    PaymentRequest:
      type: object
      required:
        - appointmentId
        - clientName
        - clientEmail
        - petName
        - vetName
        - appointmentDate
        - appointmentTime
        - concept
        - baseAmount
        - amount
      properties:
        appointmentId:
          type: integer
          format: int64
          description: ID de la cita asociada
          example: 1
        clientName:
          type: string
          example: "Juan Pérez"
        clientEmail:
          type: string
          format: email
          example: "juan.perez@example.com"
        petName:
          type: string
          example: "Max"
        vetName:
          type: string
          example: "Dr. Carlos Martínez"
        appointmentDate:
          type: string
          format: date
          description: Fecha de la cita (YYYY-MM-DD)
          example: "2024-03-20"
        appointmentTime:
          type: string
          format: time
          description: Hora de la cita (HH:mm)
          example: "10:00"
        concept:
          type: string
          description: Concepto del servicio
          example: "Consulta general"
        baseAmount:
          type: number
          format: decimal
          description: Precio base del servicio
          example: 50000
          minimum: 0
        amount:
          type: number
          format: decimal
          description: Monto final (puede diferir del base si se ajustó)
          example: 50000
          minimum: 0
        notes:
          type: string
          description: Notas adicionales opcionales
    
    PaymentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        appointmentId:
          type: integer
          format: int64
          example: 1
        clientName:
          type: string
          example: "Juan Pérez"
        clientEmail:
          type: string
          format: email
          example: "juan.perez@example.com"
        petName:
          type: string
          example: "Max"
        vetName:
          type: string
          example: "Dr. Carlos Martínez"
        appointmentDate:
          type: string
          format: date
          example: "2024-03-20"
        appointmentTime:
          type: string
          format: time
          example: "10:00"
        concept:
          type: string
          example: "Consulta general"
        baseAmount:
          type: number
          format: decimal
          example: 50000
        amount:
          type: number
          format: decimal
          example: 50000
        status:
          type: string
          enum:
            - PENDING
            - PAID
          description: Estado del pago
          example: "PAID"
        paymentDate:
          type: string
          format: date-time
          description: Fecha/hora del cobro efectivo (null si PENDING)
          example: "2024-03-20T10:30:00"
        receivedBy:
          type: string
          description: Email de quien registró el pago
          example: "recepcionista@pawsoft.com"
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
          example: "2024-03-20T10:00:00"
    
    ServicePriceRequest:
      type: object
      required:
        - serviceType
        - displayName
        - price
      properties:
        serviceType:
          type: string
          description: Identificador único del servicio
          example: "consulta"
        displayName:
          type: string
          description: Nombre a mostrar
          example: "Consulta general"
        price:
          type: number
          format: decimal
          description: Precio base del servicio
          example: 50000
          minimum: 0
        description:
          type: string
          description: Descripción del servicio
          example: "Consulta veterinaria general"
        active:
          type: boolean
          description: Si el servicio está activo
          default: true
          example: true
    
    ServicePriceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        serviceType:
          type: string
          example: "consulta"
        displayName:
          type: string
          example: "Consulta general"
        price:
          type: number
          format: decimal
          example: 50000
        description:
          type: string
          example: "Consulta veterinaria general"
        active:
          type: boolean
          example: true
    
    PaymentStatsResponse:
      type: object
      properties:
        totalPaid:
          type: integer
          format: int64
          description: Total de pagos confirmados
          example: 150
        totalPending:
          type: integer
          format: int64
          description: Total de pagos pendientes
          example: 25
        revenueToday:
          type: number
          format: decimal
          description: Ingresos cobrados hoy
          example: 500000
        revenueThisWeek:
          type: number
          format: decimal
          description: Ingresos cobrados en la semana actual
          example: 2500000
        revenueThisMonth:
          type: number
          format: decimal
          description: Ingresos cobrados en el mes actual
          example: 10000000
        revenueAllTime:
          type: number
          format: decimal
          description: Ingresos totales históricos
          example: 50000000
        revenueByConceptThisMonth:
          type: object
          additionalProperties:
            type: number
            format: decimal
          description: Ingresos por concepto de servicio en el mes actual
          example:
            "Consulta general": 3000000
            "Vacunación": 2500000
            "Cirugía": 4500000
        recentPayments:
          type: array
          description: Últimos 10 pagos confirmados
          items:
            $ref: '#/components/schemas/PaymentResponse'
    
    # ─────────────────────────────────────────────────────────────────────────
    # CLIENTES (RECEPCIONISTA)
    # ─────────────────────────────────────────────────────────────────────────
    
    RecepCreateClientRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          description: Nombre completo del cliente
          example: "María González"
        email:
          type: string
          format: email
          description: Correo electrónico
          example: "maria.gonzalez@example.com"
        phone:
          type: string
          description: Teléfono colombiano (opcional)
          example: "3009876543"
          pattern: '^3[0-9]{9}$'
    
    RecepUpdateClientRequest:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
          description: Nombre completo del cliente
          example: "María González Pérez"
        email:
          type: string
          format: email
          description: Nuevo correo (opcional)
          example: "maria.gonzalez.new@example.com"
        telefono:
          type: string
          description: Teléfono de contacto (opcional)
          example: "3009876543"
    
    # ─────────────────────────────────────────────────────────────────────────
    # PERFIL
    # ─────────────────────────────────────────────────────────────────────────
    
    ProfileUpdateRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Código 2FA de verificación
          example: "123456"
        email:
          type: string
          format: email
          description: Nuevo correo (opcional)
        phone:
          type: string
          description: Nuevo teléfono (opcional)
        newPassword:
          type: string
          format: password
          description: Nueva contraseña (opcional)
    
    # ─────────────────────────────────────────────────────────────────────────
    # ERRORES
    # ─────────────────────────────────────────────────────────────────────────
    
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: Código de estado HTTP
          example: 400
        message:
          type: string
          description: Mensaje descriptivo del error
          example: "El correo ya está registrado"
        timestamp:
          type: string
          format: date-time
          description: Fecha y hora del error
          example: "2024-03-20T10:00:00"

# ═══════════════════════════════════════════════════════════════════════════
# EJEMPLOS DE RESPUESTAS DE ERROR
# ═══════════════════════════════════════════════════════════════════════════

  examples:
    Error400:
      value:
        status: 400
        message: "Datos inválidos en la solicitud"
        timestamp: "2024-03-20T10:00:00"
    
    Error401:
      value:
        status: 401
        message: "Credenciales inválidas"
        timestamp: "2024-03-20T10:00:00"
    
    Error403:
      value:
        status: 403
        message: "No tienes permisos para acceder a este recurso"
        timestamp: "2024-03-20T10:00:00"
    
    Error404:
      value:
        status: 404
        message: "Recurso no encontrado"
        timestamp: "2024-03-20T10:00:00"
    
    Error409:
      value:
        status: 409
        message: "El correo ya está registrado"
        timestamp: "2024-03-20T10:00:00"
    
    Error500:
      value:
        status: 500
        message: "Error interno del servidor"
        timestamp: "2024-03-20T10:00:00"
