openapi: 3.0.3
info:
  title: Pawsoft API
  description: |
    API REST completa del sistema de gestión veterinaria Pawsoft.
    
    **Proyecto**: Pawsoft - Sistema de Gestión Veterinaria
    **Universidad**: Universidad del Quindío
    **Programa**: Ingeniería de Sistemas y Computación
    **Materia**: Software III
    
    **Autoras**:
    - Valentina Porras Salazar
    - Helen Xiomara Giraldo Libreros
    
    **Profesor**: Raúl Yulbraynner Rivera Gálvez
    
    ## Autenticación
    La API utiliza JWT (JSON Web Tokens) para autenticación. Todos los endpoints protegidos requieren el header:
    ```
    Authorization: Bearer <token>
    ```
    
    ## Roles del Sistema
    - **ROLE_ADMIN**: Acceso completo al sistema
    - **ROLE_VETERINARIO**: Gestión de citas asignadas
    - **ROLE_RECEPCIONISTA**: Gestión de clientes, citas y pagos
    - **ROLE_CLIENTE**: Auto-gestión de mascotas y citas
    
    ## Flujo de Autenticación 2FA
    1. POST /auth/login → Envía código 2FA al correo
    2. POST /auth/verify-2fa → Valida código y retorna JWT
    
  version: 1.0.0
  contact:
    name: Equipo Pawsoft
    email: soporte@pawsoft.online
  
servers:
  - url: https://api.pawsoft.online
    description: Servidor de producción
  - url: http://localhost:8080
    description: Servidor de desarrollo local

tags:
  - name: Autenticación
    description: Endpoints de login, 2FA, recuperación de contraseña y verificación de cuenta
  - name: Usuarios
    description: Gestión de usuarios del sistema
  - name: Admin - Usuarios
    description: Panel de administración de usuarios staff
  - name: Admin - Pagos
    description: Panel de administración de pagos y precios
  - name: Recepcionista - Citas
    description: Gestión de citas desde el panel de recepcionista
  - name: Recepcionista - Clientes
    description: Gestión de clientes y mascotas desde el panel de recepcionista
  - name: Recepcionista - Pagos
    description: Gestión de pagos desde el panel de recepcionista
  - name: Cliente - Citas
    description: Auto-gestión de citas del cliente
  - name: Cliente - Mascotas
    description: Auto-gestión de mascotas del cliente
  - name: Cliente - Pagos
    description: Consulta de pagos del cliente
  - name: Veterinario - Citas
    description: Consulta de citas asignadas al veterinario
  - name: Perfil
    description: Gestión del perfil del usuario autenticado

paths:
  # ═══════════════════════════════════════════════════════════════════════════
  # AUTENTICACIÓN
  # ═══════════════════════════════════════════════════════════════════════════
  
  /auth/register:
    post:
      tags:
        - Autenticación
      summary: Registrar nuevo cliente
      description: |
        Crea una nueva cuenta de cliente en el sistema.
        Envía un correo de verificación al email proporcionado.
        Requiere validación de reCAPTCHA v2.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Datos inválidos o correo ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión (Fase 1 - 2FA)
      description: |
        Valida credenciales y envía código 2FA al correo del usuario.
        No retorna JWT todavía - requiere verificación del código.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Código 2FA enviado al correo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /auth/verify-2fa:
    post:
      tags:
        - Autenticación
      summary: Verificar código 2FA (Fase 2)
      description: |
        Valida el código 2FA enviado al correo y retorna el JWT.
        Este es el paso final del proceso de autenticación.
      operationId: verify2FA
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Autenticación exitosa - JWT retornado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Código inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /auth/resend-2fa:
    post:
      tags:
        - Autenticación
      summary: Reenviar código 2FA
      description: Reenvía el código 2FA sin requerir contraseña nuevamente
      operationId: resend2FA
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Código reenviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  
  /auth/change-password-first:
    post:
      tags:
        - Autenticación
      summary: Cambiar contraseña en primer inicio
      description: |
        Permite cambiar la contraseña temporal asignada por el sistema.
        Usado por staff creado por el administrador.
      operationId: changePasswordFirst
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada - JWT retornado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  
  /auth/password-reset/request:
    post:
      tags:
        - Autenticación
      summary: Solicitar restablecimiento de contraseña
      description: |
        Envía un correo con enlace de recuperación.
        Responde de forma genérica para no revelar si el correo existe.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordReset'
      responses:
        '200':
          description: Solicitud procesada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: "Si el correo existe, se ha enviado un enlace de recuperación."
  
  /auth/password-reset/confirm:
    post:
      tags:
        - Autenticación
      summary: Confirmar restablecimiento de contraseña
      description: Establece nueva contraseña usando el token recibido por correo
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Contraseña actualizada correctamente"
  
  /auth/verify-email:
    get:
      tags:
        - Autenticación
      summary: Verificar cuenta por correo
      description: Activa la cuenta usando el token enviado al correo de registro
      operationId: verifyEmail
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cuenta verificada
          content:
            text/plain:
              schema:
                type: string
                example: "Cuenta verificada correctamente. Puedes cerrar esta ventana."
  
  /auth/resend-verification:
    post:
      tags:
        - Autenticación
      summary: Reenviar correo de verificación
      description: Reenvía el enlace de verificación de cuenta
      operationId: resendVerification
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Solicitud procesada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: "Si el correo existe y no está verificado, se ha reenviado el enlace."


  # ═══════════════════════════════════════════════════════════════════════════
  # ADMIN - USUARIOS
  # ═══════════════════════════════════════════════════════════════════════════
  
  /api/admin/users:
    get:
      tags:
        - Admin - Usuarios
      summary: Listar usuarios staff
      description: Retorna todos los usuarios staff (veterinarios y recepcionistas)
      operationId: getStaffUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
    
    post:
      tags:
        - Admin - Usuarios
      summary: Crear usuario staff
      description: |
        Crea un nuevo usuario staff (veterinario o recepcionista).
        Genera contraseña temporal y la envía por correo.
      operationId: createStaffUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserRequest'
      responses:
        '200':
          description: Usuario staff creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  
  /api/admin/users/{id}:
    put:
      tags:
        - Admin - Usuarios
      summary: Actualizar usuario staff
      description: Actualiza nombre y foto del usuario staff
      operationId: updateStaffUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    
    delete:
      tags:
        - Admin - Usuarios
      summary: Eliminar usuario staff
      description: Elimina un usuario staff del sistema
      operationId: deleteStaffUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Usuario eliminado
        '403':
          description: No puedes eliminarte a ti mismo
  
  /api/admin/users/{id}/toggle:
    patch:
      tags:
        - Admin - Usuarios
      summary: Activar/desactivar usuario
      description: Cambia el estado enabled del usuario
      operationId: toggleUserStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Estado actualizado
  
  /api/admin/veterinarians:
    get:
      tags:
        - Admin - Usuarios
      summary: Listar veterinarios activos
      description: Retorna solo veterinarios con enabled=true
      operationId: getVeterinarians
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de veterinarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
  
  /api/admin/public/veterinarians:
    get:
      tags:
        - Admin - Usuarios
      summary: Listar veterinarios (público)
      description: |
        Endpoint accesible por clientes para agendar citas.
        Retorna veterinarios activos.
      operationId: getVeterinariansPublic
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de veterinarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
  
  /api/admin/clients:
    get:
      tags:
        - Admin - Usuarios
      summary: Listar todos los clientes
      description: Retorna todos los usuarios con rol ROLE_CLIENTE
      operationId: getAllClients
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
  
  /api/admin/pets:
    get:
      tags:
        - Admin - Usuarios
      summary: Listar todas las mascotas
      description: Retorna todas las mascotas registradas en el sistema
      operationId: getAllPets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de mascotas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetResponse'

  # ═══════════════════════════════════════════════════════════════════════════
  # ADMIN - PAGOS
  # ═══════════════════════════════════════════════════════════════════════════
  
  /api/admin/payments:
    get:
      tags:
        - Admin - Pagos
      summary: Listar todos los pagos
      description: Retorna todos los pagos del sistema
      operationId: getAllPayments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pagos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'
  
  /api/admin/payments/stats:
    get:
      tags:
        - Admin - Pagos
      summary: Estadísticas financieras
      description: |
        Retorna estadísticas completas:
        - Ingresos por período (hoy, semana, mes, total)
        - Ingresos por concepto de servicio
        - Últimos 10 pagos confirmados
      operationId: getPaymentStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estadísticas financieras
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatsResponse'
  
  /api/admin/payments/client/{email}:
    get:
      tags:
        - Admin - Pagos
      summary: Historial de pagos de un cliente
      description: Retorna todos los pagos de un cliente específico
      operationId: getPaymentsByClient
      security:
        - bearerAuth: []
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Historial de pagos del cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'
  
  /api/admin/payments/{id}/revert:
    put:
      tags:
        - Admin - Pagos
      summary: Revertir pago a PENDING
      description: |
        Cambia un pago de PAID a PENDING.
        Usado para corrección de errores.
      operationId: revertPayment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Pago revertido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
  
  /api/admin/payments/prices:
    get:
      tags:
        - Admin - Pagos
      summary: Listar todos los precios
      description: Retorna todos los precios configurados (activos e inactivos)
      operationId: getAllPrices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de precios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServicePriceResponse'
    
    post:
      tags:
        - Admin - Pagos
      summary: Crear o actualizar precio
      description: |
        Si el serviceType ya existe, actualiza el precio.
        Si no existe, crea uno nuevo.
      operationId: upsertPrice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePriceRequest'
      responses:
        '200':
          description: Precio creado o actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePriceResponse'
  
  /api/admin/payments/prices/{id}:
    delete:
      tags:
        - Admin - Pagos
      summary: Eliminar precio
      description: Elimina un precio de servicio del sistema
      operationId: deletePrice
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Precio eliminado


  # ═══════════════════════════════════════════════════════════════════════════
  # RECEPCIONISTA - CITAS
  # ═══════════════════════════════════════════════════════════════════════════
  
  /api/recepcionista/appointments:
    get:
      tags:
        - Recepcionista - Citas
      summary: Listar todas las citas
      description: Retorna todas las citas del sistema con datos completos
      operationId: getAllAppointments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de citas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecepAppointmentResponse'
    
    post:
      tags:
        - Recepcionista - Citas
      summary: Crear cita
      description: Crea una nueva cita especificando el email del cliente
      operationId: createAppointmentRecep
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecepCreateAppointmentRequest'
      responses:
        '200':
          description: Cita creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecepAppointmentResponse'
  
  /api/recepcionista/appointments/{id}:
    put:
      tags:
        - Recepcionista - Citas
      summary: Editar cita
      description: Actualiza fecha, hora, veterinario y motivo de una cita
      operationId: updateAppointmentRecep
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecepUpdateAppointmentRequest'
      responses:
        '200':
          description: Cita actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecepAppointmentResponse'
  
  /api/recepcionista/appointments/{id}/confirm:
    put:
      tags:
        - Recepcionista - Citas
      summary: Confirmar cita
      description: Cambia el estado de la cita a CONFIRMED
      operationId: confirmAppointment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Cita confirmada
  
  /api/recepcionista/appointments/{id}/no-show:
    put:
      tags:
        - Recepcionista - Citas
      summary: Marcar inasistencia
      description: Cambia el estado de la cita a NO_SHOW
      operationId: markNoShow
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Inasistencia marcada
  
  /api/recepcionista/appointments/{id}/cancel:
    put:
      tags:
        - Recepcionista - Citas
      summary: Cancelar cita
      description: Cancela una cita con motivo opcional
      operationId: cancelAppointmentRecep
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecepCancelRequest'
      responses:
        '204':
          description: Cita cancelada
  
  /api/recepcionista/appointments/slots:
    get:
      tags:
        - Recepcionista - Citas
      summary: Consultar horarios ocupados
      description: Retorna las horas ocupadas de un veterinario en una fecha
      operationId: getOccupiedSlotsRecep
      security:
        - bearerAuth: []
      parameters:
        - name: vetId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2024-03-15"
      responses:
        '200':
          description: Lista de horarios ocupados
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: "09:00:00"

  # ═══════════════════════════════════════════════════════════════════════════
  # RECEPCIONISTA - CLIENTES
  # ═══════════════════════════════════════════════════════════════════════════
  
  /api/recepcionista/clients:
    get:
      tags:
        - Recepcionista - Clientes
      summary: Listar clientes
      description: Retorna todos los clientes registrados
      operationId: getClients
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
    
    post:
      tags:
        - Recepcionista - Clientes
      summary: Crear cliente
      description: |
        Crea un nuevo cliente.
        Genera contraseña automática y la envía por correo.
      operationId: createClient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecepCreateClientRequest'
      responses:
        '201':
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  
  /api/recepcionista/clients/{id}:
    put:
      tags:
        - Recepcionista - Clientes
      summary: Actualizar cliente
      description: Actualiza nombre, email y teléfono del cliente
      operationId: updateClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecepUpdateClientRequest'
      responses:
        '200':
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    
    delete:
      tags:
        - Recepcionista - Clientes
      summary: Eliminar cliente
      description: Elimina un cliente y todas sus mascotas y citas
      operationId: deleteClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Cliente eliminado
  
  /api/recepcionista/clients/{id}/toggle:
    patch:
      tags:
        - Recepcionista - Clientes
      summary: Activar/desactivar cliente
      description: Cambia el estado enabled del cliente
      operationId: toggleClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
